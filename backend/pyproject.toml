[project]
name = "gearshare-backend"
version = "0.1.0"
description = "GearShare FastAPI bootstrap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
