[project]
name = "gearshare-backend"
version = "0.1.0"
description = "GearShare FastAPI bootstrap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.146.0",
    "sqlalchemy>=2.0,<2.1",
    "tzdata>=2024.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "persistence: #12 persistence, parity, contention and restart campaign (part of the default run)",
    "subprocess: starts the real backend as an operating-system process on a port in 6400-6499",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
